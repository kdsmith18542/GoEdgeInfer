# GoEdgeInfer configuration file
server_port: "8080"
worker_pool_size: 4
model_path: "testdata/test_model.onnx"
logging:
  level: "info"
pipeline:
  - type: "normalize"
    params: {}
  - type: "softmax"
    params: {}
  - type: "apply_threshold"
    params:
      threshold: 0.7
  - type: "map_to_labels"
    params:
      labels: ["cat", "dog", "bird"]
s3:
  endpoint: "http://localhost:9000"
  bucket: "models"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  region: "us-east-1"
  use_ssl: false
api_key: "changeme-supersecret-key"
# Secrets (keys, certs) come from env/vault — never the repo. See SECURITY.md.
signature_verification:
  enabled: false
  public_key_pem: "" # e.g. /run/secrets/signing_pub.pem
tls:
  enabled: false
  cert_file: "" # e.g. /run/secrets/server.crt
  key_file: "" # e.g. /run/secrets/server.key
  client_ca: "" # e.g. /run/secrets/ca.crt
  require_client_cert: true
jwt:
  enabled: false
  issuer: ""
  audience: ""
  jwks_url: ""
  secret: "changeme-jwt-secret"
  algorithm: "HS256"
  require_role: "admin"
  require_scope: "manage"

# Execution provider for ONNX Runtime inference
# type: "cpu", "cuda", or "tensorrt"
# device_id: GPU device index (0 = primary GPU)
# Supported GPU architectures: Pascal (GTX 10xx, compute 6.0/6.1) and newer
execution_provider:
  type: "cuda"
  device_id: 0

# ONNX Runtime shared library
# lib_path: override the libonnxruntime.so location (env ORT_LIB_PATH wins)
# session_pool_size: per-model session+tensor sets checked out per request
#   (0 = use worker_pool_size)
onnxruntime:
  lib_path: ""
  session_pool_size: 0

